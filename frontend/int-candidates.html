<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../images/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Candidates - Altrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/job-openings.css">
<link rel="stylesheet" href="css/candidates.css">
<link rel="stylesheet" href="css/hm-shared.css">
</head>
<body class="dashboard-body">

<div class="dashboard-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="../images/logo.png" alt="Altrium logo" width="34" height="38">
      <span class="sidebar-logo-text">altrium</span>
    </div>

    <ul class="sidebar-nav">
      <li><a href="interviewer-dashboard.html"><i class="bi bi-grid"></i> Dashboard</a></li>
      <li><a href="int-interviews.html"><i class="bi bi-calendar-event"></i> My Interviews</a></li>
      <li class="active"><a href="int-candidates.html"><i class="bi bi-people"></i> My Candidates</a></li>
      <li><a href="int-criteria.html"><i class="bi bi-clipboard-check"></i> Evaluation Criteria</a></li>
    </ul>

    
  </aside>

  <main class="main-content">
    <div id="guardMessage" class="alert alert-warning d-none" role="alert"></div>

    <div id="pageContent" class="d-none">
      <div class="mb-4">
        <h3 class="welcome-heading mb-1">My Candidates <span class="readonly-badge">Read-only</span></h3>
        <p class="page-header-sub">Candidates from interviews assigned to you</p>
      </div>

      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <div id="candidatesLoading" class="text-muted small">Loading your candidates...</div>
          <div id="candidatesEmpty" class="text-muted small d-none">No candidates are associated with your assigned interviews yet.</div>
          <div class="table-responsive">
            <table class="table jobs-table align-middle d-none" id="candidatesTable">
              <thead><tr><th>Name</th><th>Position</th><th>Stage</th><th>CV</th><th class="text-end">Details</th></tr></thead>
              <tbody id="candidatesTableBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="modal fade" id="candidateViewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="viewTitle">Candidate Profile</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="viewBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/int-common.js"></script>
<script src="js/int-candidates.js"></script>
<script src="js/footer.js"></script> 
<script src="js/topbar.js"></script>
<script src="js/mobile-nav.js"></script>
</body>
</html>
