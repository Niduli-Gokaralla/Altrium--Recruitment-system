<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="../images/logo.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Altrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrapper d-flex align-items-center justify-content-center">
  <div class="login-card shadow-lg d-flex flex-column flex-md-row">

    <div class="brand-panel d-flex flex-column align-items-center justify-content-center text-center p-4">
      <div class="brand-icon mb-3">
        <img src="../images/logo.png"
       alt="Altrium Logo" 
       class="altrium-logo">
      </div>
      <h2 class="brand-name mb-1">altrium</h2>
      <p class="brand-tagline mb-0">Recruitment &amp; Hiring Tracker</p>
    </div>

    <div class="form-panel p-4 p-md-5 flex-grow-1">
      <h3 class="mb-1 text-center fw-bold">Login</h3>
      <p class="text-muted mb-4 text-center">Enter your registered username and password</p>

      <div id="loginError" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
          </div>
          <div class="invalid-feedback">Please enter your username.</div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
            <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password">
              <i class="bi bi-eye"></i>
            </button>
          </div>
          <div class="invalid-feedback">Please enter your password.</div>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember Me?</label>
          </div>
          <a href="forgot-password.html">Forgot Password?</a>
        </div>

        <button type="submit" class="btn btn-login w-100" id="loginBtn">
          <span class="btn-text">Log In</span>
          <span class="spinner-border spinner-border-sm d-none" id="loginSpinner"></span>
        </button>
      </form>
    </div>

  </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>
<script src="js/footer.js"></script> 
</body>
</html>
