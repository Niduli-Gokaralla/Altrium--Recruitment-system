<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Altrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-wrapper d-flex align-items-center justify-content-center">
  <div class="login-card shadow-lg d-flex flex-column flex-md-row">

    <div class="brand-panel d-flex flex-column align-items-center justify-content-center text-center p-4">
      <div class="brand-icon mb-3">
        <svg viewBox="0 0 100 110" width="72" height="80" xmlns="http://www.w3.org/2000/svg" aria-label="Altrium logo">
          <polygon points="50,4 93,27 93,73 50,96 7,73 7,27" fill="#f6b93b" stroke="#f6b93b" stroke-width="2" stroke-linejoin="round"/>
          <polygon points="50,32 68,68 32,68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linejoin="round"/>
          <circle cx="72" cy="18" r="5" fill="#f6b93b"/>
        </svg>
      </div>
      <h2 class="brand-name mb-1">altrium</h2>
      <p class="brand-tagline mb-0">HR Recruitment &amp; Hiring Tracker</p>
    </div>

    <div class="form-panel p-4 p-md-5 flex-grow-1">
      <h3 class="mb-1 text-center fw-bold">Forgot Password</h3>
      <p class="text-muted mb-4 text-center">Enter your username and we'll email you a reset link</p>

      <div id="formError" class="alert alert-danger d-none" role="alert"></div>
      <div id="formSuccess" class="alert alert-success d-none" role="alert"></div>

      <form id="forgotForm" novalidate>
        <div class="mb-4">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" name="username" required autocomplete="username">
          </div>
          <div class="invalid-feedback">Please enter your username.</div>
        </div>

        <button type="submit" class="btn btn-login w-100" id="submitBtn">
          <span class="btn-text">Send Reset Link</span>
          <span class="spinner-border spinner-border-sm d-none" id="submitSpinner"></span>
        </button>

        <p class="text-center mt-4 mb-0">
          <a href="login.html">Back to Login</a>
        </p>
      </form>
    </div>

  </div>
</div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<script src="js/forgot-password.js"></script>
<script src="js/footer.js"></script> 
<script src="js/topbar.js"></script>
</body>
</html>
